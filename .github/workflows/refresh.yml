name: Refresh data and publish map

on:
  schedule:
    - cron: "0 2 1 * *" # 1st of each month, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    # GitHub disables scheduled workflows in a public repo after 60 days without repository
    # activity. Re-enabling this workflow through the API on every run keeps that from happening,
    # without making any commits. It has no dependencies, so it runs even if refresh fails.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/enable"

  refresh:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch source GeoJSON
        id: fetch
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python scripts/fetch_geojson.py

      - name: Inject lat/lon and slim properties
        if: steps.fetch.outputs.result == 'changed'
        run: python scripts/inject_latlon.py

      - name: Summarise points into regions
        if: steps.fetch.outputs.result == 'changed'
        run: python scripts/make_regions.py

      - name: Commit updated data
        if: steps.fetch.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh data.gov.sg GeoJSON"
          git push

  export:
    needs: refresh
    # always export on a manual run so the map can be rebuilt without new data
    if: needs.refresh.outputs.result == 'changed' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TIPPECANOE_VERSION: "2.79.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # pick up the data commit made above

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build tippecanoe
        # Ubuntu has no tippecanoe package, so build the pinned release from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Build site (page, data, lamp post tiles, MapLibre)
        run: python scripts/build_site.py --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
