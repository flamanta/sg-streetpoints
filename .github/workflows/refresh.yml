name: Refresh data and publish map

on:
  schedule:
    - cron: "0 2 1 * *" # 1st of each month, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch source GeoJSON
        id: fetch
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python scripts/fetch_geojson.py

      - name: Inject lat/lon and slim properties
        if: steps.fetch.outputs.result == 'changed'
        run: python scripts/inject_latlon.py

      - name: Commit updated data
        if: steps.fetch.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh data.gov.sg GeoJSON"
          git push

  export:
    needs: refresh
    # always export on a manual run so the map can be rebuilt without new data
    if: needs.refresh.outputs.result == 'changed' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: qgis/qgis:ltr
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # pick up the data commit made above

      - name: Install qgis2web
        run: python3 scripts/install_qgis2web.py

      - name: Build QGIS project
        run: python3 scripts/build_project.py

      - name: Export web map
        run: python3 scripts/export_web.py site

      - uses: actions/upload-artifact@v7
        with:
          name: qgis-project
          path: qgis/sg-streetpoints.qgz

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
